name: Test Bot

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenCode provider/model (defaults to repository variable or available key)"
        required: false
        type: string
      search_provider:
        description: "Search provider (configured uses repository variable or random)"
        required: false
        type: choice
        default: configured
        options: [configured, random, exa, firecrawl, parallel, tavily, tinyfish]
      session_timeout:
        description: "Agent session timeout in seconds"
        required: false
        type: string
      ensemble_concurrency:
        description: "Maximum concurrent ensemble sessions"
        required: false
        type: string

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: bash scripts/install.sh
      - name: Run bot
        uses: ./.github/actions/run-forecast
        with:
          mode: test_questions
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_MODEL: ${{ inputs.model || vars.OPENCODE_MODEL || (secrets.OPENROUTER_API_KEY != '' && 'openrouter/openai/gpt-4.1-mini') || (secrets.OPENAI_API_KEY != '' && 'openai/gpt-4.1-mini') || (secrets.ANTHROPIC_API_KEY != '' && 'anthropic/claude-sonnet-4-5') || '' }}
          OPENCODE_SEARCH_PROVIDER: ${{ (inputs.search_provider != 'configured' && inputs.search_provider) || vars.OPENCODE_SEARCH_PROVIDER || 'random' }}
          METAC_BOT_SESSION_TIMEOUT: ${{ inputs.session_timeout || vars.METAC_BOT_SESSION_TIMEOUT || '900' }}
          METAC_BOT_ENSEMBLE_CONCURRENCY: ${{ inputs.ensemble_concurrency || vars.METAC_BOT_ENSEMBLE_CONCURRENCY || '2' }}
          METAC_BOT_API_TIMEOUT: ${{ vars.METAC_BOT_API_TIMEOUT }}
          METAC_BOT_SERVICE_START_TIMEOUT: ${{ vars.METAC_BOT_SERVICE_START_TIMEOUT }}
          METAC_BOT_SINGLE_AGENT: ${{ vars.METAC_BOT_SINGLE_AGENT }}
          METAC_BOT_ENSEMBLE_MIN_MEMBERS: ${{ vars.METAC_BOT_ENSEMBLE_MIN_MEMBERS }}
          METAC_BOT_ENSEMBLE_REVIEW_ROUNDS: ${{ vars.METAC_BOT_ENSEMBLE_REVIEW_ROUNDS }}
          METAC_BOT_ENSEMBLE_TOLERANCE: ${{ vars.METAC_BOT_ENSEMBLE_TOLERANCE }}
          METAC_BOT_ENSEMBLE_PROPOSAL_TIMEOUT: ${{ vars.METAC_BOT_ENSEMBLE_PROPOSAL_TIMEOUT }}
          METAC_BOT_ENSEMBLE_REVIEW_TIMEOUT: ${{ vars.METAC_BOT_ENSEMBLE_REVIEW_TIMEOUT }}
          METAC_BOT_ENSEMBLE_DECISION_TIMEOUT: ${{ vars.METAC_BOT_ENSEMBLE_DECISION_TIMEOUT }}
          METAC_BOT_ENSEMBLE_MODELS: ${{ vars.METAC_BOT_ENSEMBLE_MODELS }}
          METAC_BOT_ENSEMBLE_ADJUDICATOR_MODEL: ${{ vars.METAC_BOT_ENSEMBLE_ADJUDICATOR_MODEL }}
